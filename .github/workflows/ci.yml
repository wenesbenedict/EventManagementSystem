name: EventSphere CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  practicum-tests:
    name: Practicum 7 and 8 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0"

      - name: Run Practicum 7 tests
        run: |
          mkdir -p test-results
          python -m pytest -v Practicum_07_White_Box \
            --junitxml=test-results/practicum-07.xml

      - name: Run Practicum 8 tests
        run: |
          python -m pytest -v Practicum_08_Black_Box \
            --junitxml=test-results/practicum-08.xml

      - name: Upload Practicum 7 and 8 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practicum-07-08-test-results
          path: test-results/
          if-no-files-found: warn

  automation-tests:
    name: Practicum 9 Selenium tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Practicum_09_Automation_Testing/requirements.txt

      - name: Install application and test dependencies
        working-directory: Practicum_09_Automation_Testing
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start EventSphere application
        working-directory: Practicum_09_Automation_Testing
        run: |
          python app.py > eventsphere.log 2>&1 &
          echo $! > eventsphere.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/events > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat eventsphere.log
          exit 1

      - name: Run Practicum 9 Selenium tests
        working-directory: Practicum_09_Automation_Testing
        run: |
          mkdir -p test-results
          python -m pytest -v test_eventsphere_registration.py \
            --junitxml=test-results/practicum-09.xml

      - name: Stop EventSphere application
        if: always()
        working-directory: Practicum_09_Automation_Testing
        run: |
          if [ -f eventsphere.pid ]; then
            kill "$(cat eventsphere.pid)" || true
          fi

      - name: Upload Practicum 9 results and application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practicum-09-test-results
          path: |
            Practicum_09_Automation_Testing/test-results/
            Practicum_09_Automation_Testing/eventsphere.log
          if-no-files-found: warn

  docker-build:
    name: Build EventSphere Docker image
    runs-on: ubuntu-latest
    needs: [practicum-tests, automation-tests]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag eventsphere:ci .
